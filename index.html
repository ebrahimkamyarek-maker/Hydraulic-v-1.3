let cur={m:0,t:0};
const lockPanel=m=>`<div class="al bad">OUTPUTS LOCKED — complete these inputs: ${m.map(k=>IN[k][0]).join(', ')}</div>`;
const safe=fn=>{try{return fn()}catch(e){return al('bad','Calculation error: '+e.message)}};
function render(){rebuild();
 $('#mods').innerHTML=MODS.map((m,i)=>`<button data-m="${i}" class="${i===cur.m?'on':''}">${m.t}</button>`).join('');
 const M=MODS[cur.m];$('#tabs').innerHTML=M.tabs.length>1?M.tabs.map((t,i)=>`<button data-t="${i}" class="${i===cur.t?'on':''}">${t.t}</button>`).join(''):'';$('#tabs').style.display=M.tabs.length>1?'flex':'none';
 const T=M.tabs[cur.t],v=$('#view');
 if(T.custom){v.innerHTML='';const box=document.createElement('div');v.appendChild(box);safe(()=>T.custom(box))}
 else{v.innerHTML=T.inp.map(g=>grp(g[0],g[1])).join('')+'<div id="out"></div><div class="row"><button id="xc">Export CSV</button><button id="xp">Print / PDF</button><button id="xk">Copy Results</button><button id="xr">Clear This Tab\'s Inputs</button></div>';refresh();
  $('#xc').onclick=exportCSV;$('#xp').onclick=()=>window.print();
  $('#xk').onclick=()=>{const tx=$('#out').innerText;const fb=()=>{const a=document.createElement('textarea');a.value=tx;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();alert('Copied')};navigator.clipboard?navigator.clipboard.writeText(tx).then(()=>alert('Copied')).catch(fb):fb()};
  $('#xr').onclick=()=>{T.inp.forEach(g=>g[1].forEach(k=>delete S[k]));save();render()}}
 $('#sub').textContent=(S.wellName||'')+' '+(S.rigName?'· '+S.rigName+' ':'')+'· '+(metric()?'Metric':'Field');$('#bU').textContent=metric()?'Metric':'Field'}
function refresh(){rebuild();const T=MODS[cur.m].tabs[cur.t];if(T.custom)return;const o=$('#out');if(!o)return;
 const m=miss(typeof T.req==='function'?T.req():(T.req||[]));if(m.length){o.innerHTML=lockPanel(m);return}
 const errs=T.geo?validate():[];if(errs.length){o.innerHTML=errs.map(x=>al('bad',x)).join('')+al('bad','OUTPUTS LOCKED until the inputs above are corrected.');return}
 o.innerHTML=safe(T.out);if(T.post)safe(T.post)}
function exportCSV(){const rows=[];document.querySelectorAll('#out table').forEach(t=>{t.querySelectorAll('tr').forEach(r=>rows.push([...r.children].map(c=>'"'+c.innerText.replace(/"/g,'""').replace(/\n/g,' ').trim()+'"').join(',')));rows.push('')});
 const fname='universal_hydraulic_'+MODS[cur.m].id+'.csv',txt='\ufeff'+rows.join('\n');
 if(window.AndroidBridge){AndroidBridge.saveText(fname,txt);return}
 const b=new Blob([txt],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=fname;document.body.appendChild(a);a.click();a.remove()}
document.addEventListener('input',e=>{const t=e.target;
 if(t.dataset&&t.dataset.r!==undefined){const i=+t.dataset.r,c=t.dataset.c;if(c==='use')S.dx[i].use=t.checked;else{const v=parseFloat(t.value);S.dx[i][c]=isNaN(v)?null:toF(dxK[c],v)}save();dxUpd();return}
 const k=t.dataset&&t.dataset.k;if(!k||!IN[k])return;const[,kd,fl]=IN[k];
 if(fl==='sel'||fl==='txt'){if(t.value)S[k]=t.value;else delete S[k]}else{const v=parseFloat(t.value);if(isNaN(v))delete S[k];else S[k]=toF(kd,v)}
 save();if(MODS[cur.m].tabs[cur.t].custom)dxUpd();else refresh()});
document.addEventListener('click',e=>{const t=e.target;
 if(t.dataset.m!==undefined){cur={m:+t.dataset.m,t:0};render()}else if(t.dataset.t!==undefined){cur.t=+t.dataset.t;render()}else if(t.dataset.go!==undefined){cur={m:+t.dataset.go,t:0};render()}
 else if(t.dataset.del!==undefined){S.dx.splice(+t.dataset.del,1);save();dxTable();dxUpd()}});
$('#bU').onclick=()=>{S._u=metric()?'F':'M';save();render()};
$('#bT').onclick=()=>{S._th=S._th==='dark'?'light':'dark';document.documentElement.dataset.theme=S._th;save();refresh()};
document.documentElement.dataset.theme=S._th;
window.addEventListener('resize',()=>{const T=MODS[cur.m].tabs[cur.t];if(T.post)safe(T.post)});
render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http')&&!window.AndroidBridge)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
